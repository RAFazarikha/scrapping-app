name: Build Windows EXE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install customtkinter pandas openpyxl requests tqdm pyinstaller playwright beautifulsoup4

      - name: Install Playwright Browsers
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH="0"
          playwright install chromium
        shell: pwsh

      - name: Build EXE with PyInstaller
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH="0"
          pyinstaller --noconfirm --onefile --noconsole --collect-all customtkinter --collect-all ttk --collect-all playwright --hidden-import customtkinter --hidden-import ttk main.py
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scraper-App-EXE
          path: dist/main.exe
