name: Build Windows EXE

on:
  push:
    branches:
      - main # Akan berjalan otomatis saat ada push ke branch main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Sesuaikan dengan versi Python yang kamu gunakan

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install customtkinter pandas openpyxl requests tqdm pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --noconsole --collect-all customtkinter --hidden-import customtkinter main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scraper-App-EXE
          path: dist/main.exe
